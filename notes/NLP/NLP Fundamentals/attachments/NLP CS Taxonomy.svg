<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title description">
  <title id="title">Where NLP fits in the computer science taxonomy</title>
  <desc id="description">Computers branches into databases, artificial intelligence, algorithms, and networking. Artificial intelligence branches into robotics, natural language processing, and search. Natural language processing branches into information retrieval, machine translation, and language analysis. Language analysis branches into semantics and parsing.</desc>
  <rect width="1500" height="940" fill="#ffffff"/>
  <text x="750" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#172554">Where does NLP fit in the CS taxonomy?</text>

